
global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    application: apexiveai-community
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # --------------------------------------------------------
  # PROMETHEUS SELF MONITORING
  # --------------------------------------------------------

  - job_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090

  # --------------------------------------------------------
  # APEXIVEAI BACKEND API
  # --------------------------------------------------------

  - job_name: apexiveai-community-api

    metrics_path: /metrics

    scrape_interval: 15s

    static_configs:
      - targets:
          - api:8000
