
groups:

  - name: apexiveai-community-alerts

    rules:

      # ----------------------------------------------------
      # API DOWN
      # ----------------------------------------------------

      - alert: ApexiveAPIUnavailable

        expr: up{job="apexiveai-community-api"} == 0

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "APEXIVEAI Community API unavailable"
          description: "The backend metrics endpoint is unreachable."

      # ----------------------------------------------------
      # HIGH API LATENCY
      # ----------------------------------------------------

      - alert: ApexiveAPIHighLatency

        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 1

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High API response latency"
          description: "API P95 latency exceeded 1 second."

      # ----------------------------------------------------
      # HIGH HTTP 5XX ERROR RATE
      # ----------------------------------------------------

      - alert: ApexiveAPIHighErrorRate

        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05

        for: 5m

        labels:
          severity: critical

        annotations:
          summary: "High API server error rate"
          description: "More than 5 percent of requests are returning 5xx."
